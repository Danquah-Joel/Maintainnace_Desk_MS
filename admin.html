<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilities Management Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #030712;
    --color-surface: rgba(15, 23, 42, 0.65);
    --color-surface-hover: rgba(30, 41, 59, 0.75);
    --color-surface-subtle: rgba(255, 255, 255, 0.05);
    --color-ink: #F8FAFC;
    --color-ink-soft: #94A3B8;
    --color-ink-muted: #64748B;
    
    --color-primary: #38BDF8;
    --color-primary-light: #60A5FA;
    --color-accent: #6366F1;
    --color-accent-light: #818CF8;
    --color-amber: #F59E0B;
    
    --color-open: #EF4444;
    --color-open-bg: rgba(239, 68, 68, 0.15);
    --color-ack: #F59E0B;
    --color-ack-bg: rgba(245, 158, 11, 0.15);
    --color-prog: #0EA5E9;
    --color-prog-bg: rgba(14, 165, 233, 0.15);
    --color-res: #10B981;
    --color-res-bg: rgba(16, 185, 129, 0.15);
    
    --color-border: rgba(255, 255, 255, 0.1);
    --color-border-strong: rgba(255, 255, 255, 0.2);
    --radius-sm: 10px;
    --radius: 20px;
    --radius-lg: 28px;
    --radius-pill: 9999px;
    
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 12px 24px -4px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.35);
    
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  
  body {
    background-color: var(--color-bg);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(3, 7, 18, 0.8) 0%, #030712 100%);
    background-attachment: fixed;
    color: var(--color-ink);
    font-family: var(--font-sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-sans);
    font-weight: 700;
    margin: 0 0 .6em 0;
    letter-spacing: -0.025em;
    color: var(--color-ink);
  }

  button { font-family: var(--font-sans); cursor: pointer; border: none; background: none; }

  select, input, textarea {
    font-family: var(--font-sans);
    font-size: 0.9rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    background: rgba(15, 23, 42, 0.6);
    color: var(--color-ink);
    transition: all 0.25s var(--ease-out);
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(10px);
  }

  select option {
    background: #0F172A;
    color: var(--color-ink);
  }

  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--color-accent-light);
    box-shadow: var(--shadow-glow);
    background: rgba(15, 23, 42, 0.85);
  }

  .app-shell { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 18px 28px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    margin: 24px 0 32px;
    position: sticky;
    top: 20px;
    z-index: 40;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow-md);
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  
  .brand-mark {
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 1.05rem;
    background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
    color: #FFF;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
  }

  .brand-title { font-weight: 800; font-size: 1.15rem; color: var(--color-ink); }
  .brand-sub { font-size: 0.68rem; color: var(--color-primary); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; display: block;}

  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    padding: 5px;
  }

  .tab {
    background: transparent;
    padding: 8px 20px;
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--color-ink-soft);
    transition: all 0.25s var(--ease-out);
  }

  .tab:hover { color: var(--color-ink); background: rgba(255, 255, 255, 0.08); }
  .tab.active { 
    background: linear-gradient(135deg, var(--color-accent) 0%, #4F46E5 100%); 
    color: #FFF; 
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); 
  }

  .session-info { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--color-ink-soft); }
  .session-name { font-weight: 600; color: var(--color-ink); }
  
  .session-role-badge {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    background: rgba(56, 189, 248, 0.1);
    color: var(--color-primary);
    border: 1px solid rgba(56, 189, 248, 0.3);
  }

  .new-report-link {
    background: linear-gradient(135deg, #10B981 0%, #059669 100%);
    color: #FFF;
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    font-size: 0.82rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    transition: all 0.25s var(--ease-out);
  }
  .new-report-link:hover { 
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); 
  }

  .view { display: none; }
  .view.active { display: block; animation: slideUp 0.35s var(--ease-out); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Board & Filters */
  .board-head { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; }
  .filters input, .filters select { font-size: 0.85rem; }
  .filters input[type=search] { width: 230px; }

  .ticket-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
  
  .empty-state {
    grid-column: 1/-1; text-align: center; padding: 60px 30px; color: var(--color-ink-soft);
    background: var(--color-surface); border: 1px dashed var(--color-border-strong); border-radius: var(--radius); font-size: 0.95rem;
    backdrop-filter: blur(12px);
  }

  /* Ticket Cards */
  .ticket {
    position: relative;
    display: flex;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.3s var(--ease-out);
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(16px);
  }

  .ticket:hover {
    box-shadow: var(--shadow-md), 0 0 20px rgba(255, 255, 255, 0.05);
    transform: translateY(-4px);
    border-color: var(--color-border-strong);
  }

  .ticket-stub {
    width: 76px;
    flex-shrink: 0;
    background: rgba(30, 41, 59, 0.6);
    color: #FFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 18px 8px;
    position: relative;
    border-right: 1px dashed var(--color-border-strong);
  }

  .ticket::before, .ticket::after {
    content: '';
    position: absolute;
    left: 76px;
    width: 14px;
    height: 14px;
    background: #030712;
    border-radius: 50%;
    transform: translateX(-50%);
    z-index: 2;
  }
  .ticket::before { top: -7px; border-bottom: 1px solid var(--color-border); }
  .ticket::after { bottom: -7px; border-top: 1px solid var(--color-border); }

  .ticket-id {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--color-ink-soft);
  }

  .stamp {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 6px;
    padding: 4px 6px;
    text-align: center;
    line-height: 1.1;
    border: 1px solid currentColor;
  }

  .ticket-main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .ticket-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  
  .tag-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .cat-tag {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    padding: 3px 10px;
    color: var(--color-primary);
  }

  .urgency-badge {
    font-size: 0.65rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    text-transform: uppercase;
  }
  
  .urgency-High { background: var(--color-open-bg); color: var(--color-open); border: 1px solid rgba(239, 68, 68, 0.3); }
  .urgency-Medium { background: var(--color-ack-bg); color: var(--color-ack); border: 1px solid rgba(245, 158, 11, 0.3); }
  .urgency-Low { background: var(--color-res-bg); color: var(--color-res); border: 1px solid rgba(16, 185, 129, 0.3); }

  .viewed-badge {
    font-size: 0.65rem; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill);
    text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px;
  }
  .viewed-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .viewed-badge.is-new { background: var(--color-open-bg); color: var(--color-open); border: 1px solid rgba(239, 68, 68, 0.3); }
  .viewed-badge.is-viewed { background: rgba(255, 255, 255, 0.05); color: var(--color-ink-muted); border: 1px solid var(--color-border); }

  .ticket-loc { font-weight: 700; font-size: 0.98rem; color: var(--color-ink); }
  .ticket-desc { font-size: 0.85rem; color: var(--color-ink-soft); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  
  .ticket-meta {
    font-size: 0.78rem; font-weight: 500; color: var(--color-ink-muted);
    display: flex; justify-content: space-between; margin-top: auto; padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .ticket-view-btn {
    align-self: flex-start;
    color: var(--color-primary); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; margin-top: 4px;
    transition: color 0.2s var(--ease-out);
  }
  .ticket-view-btn:hover { color: var(--color-accent-light); }

  /* Dashboard */
  .stat-row { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .stat-card { 
    background: var(--color-surface); 
    border: 1px solid var(--color-border); 
    border-radius: var(--radius); 
    padding: 24px; 
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow-sm);
  }
  .stat-value { font-size: 2.4rem; font-weight: 800; color: var(--color-ink); line-height: 1; }
  .stat-label { font-size: 0.75rem; color: var(--color-ink-soft); text-transform: uppercase; margin-top: 10px; font-weight: 700; letter-spacing: 0.05em; }

  .chart-row { margin-top: 24px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
  .chart-card { 
    background: var(--color-surface); 
    border: 1px solid var(--color-border); 
    border-radius: var(--radius); 
    padding: 24px; 
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow-sm);
  }
  .chart-card h3 { font-size: 0.85rem; margin-bottom: 20px; color: var(--color-ink-soft); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
  .chart-card canvas { max-height: 260px; }

  /* Modals & Buttons */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(3, 7, 18, 0.8);
    backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal {
    background: rgba(15, 23, 42, 0.95); border-radius: var(--radius-lg);
    max-width: 580px; width: 100%; padding: 36px; max-height: 90vh; overflow-y: auto; position: relative;
    border: 1px solid var(--color-border-strong);
    box-shadow: var(--shadow-lg), var(--shadow-glow);
  }
  .modal-close { position: absolute; top: 20px; right: 24px; font-size: 1.6rem; color: var(--color-ink-muted); transition: color 0.2s; }
  .modal-close:hover { color: var(--color-ink); }
  .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .modal-id { font-family: var(--font-mono); font-weight: 800; color: var(--color-ink); font-size: 1.15rem; }
  .modal-section { margin-top: 24px; }
  .modal-section h4 { font-size: 0.75rem; text-transform: uppercase; color: var(--color-ink-soft); margin: 0 0 10px; font-weight: 700; letter-spacing: 0.05em; }
  .modal-section textarea { width: 100%; }
  
  .timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .timeline li { font-size: 0.88rem; display: flex; justify-content: space-between; border-left: 2px solid var(--color-amber); padding-left: 14px; }

  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }

  .btn-primary {
    background: linear-gradient(135deg, var(--color-accent) 0%, #4F46E5 100%);
    color: #FFF; border-radius: var(--radius-pill); padding: 12px 24px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase;
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    transition: all 0.25s var(--ease-out);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(99, 102, 241, 0.6); }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.05); color: var(--color-ink); border: 1px solid var(--color-border);
    border-radius: var(--radius-pill); padding: 12px 20px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase;
    transition: all 0.25s var(--ease-out);
  }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

  .thankyou-modal { max-width: 480px; text-align: center; padding: 44px 36px 36px; }
  .thankyou-icon { font-size: 2.8rem; margin-bottom: 12px; }
  .thankyou-ticket {
    margin: 20px 0; padding: 14px 18px; border-radius: var(--radius-sm);
    background: var(--color-res-bg); color: var(--color-res); font-size: 0.95rem; font-weight: 600;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .toast {
    position: fixed; bottom: 28px; right: 28px; background: rgba(15, 23, 42, 0.9); color: #FFF; padding: 14px 24px;
    border-radius: var(--radius-pill); font-size: 0.9rem; font-weight: 600; opacity: 0; transform: translateY(15px);
    transition: all 0.3s var(--ease-out); pointer-events: none; z-index: 60;
    border: 1px solid var(--color-border-strong);
    box-shadow: var(--shadow-lg), var(--shadow-glow);
    backdrop-filter: blur(12px);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .modal-photo { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--color-border); display: block; }

  @media (max-width: 768px) {
    .chart-row { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 16px; border-radius: var(--radius); }
    .tabs { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">FD</span>
      <div class="brand-text">
        <span class="brand-title">Facilities Desk</span>
        <span class="brand-sub">Management Console</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="board" role="tab">Work Orders</button>
      <button class="tab" data-view="dashboard" role="tab">Dashboard</button>
    </nav>
    <div class="session-info">
      <span class="session-name">Facilities Staff</span>
      <span class="session-role-badge">Admin</span>
      <a href="index.html" class="new-report-link">+ File New Ticket</a>
    </div>
  </header>

  <main class="main">

    <section id="view-board" class="view active">
      <div class="board-head">
        <h2>Work Orders</h2>
        <div class="filters">
          <input type="search" id="filter-search" placeholder="Search by ID or description">
          <select id="filter-category"><option value="all">All Categories</option></select>
          <select id="filter-building"><option value="all">All Buildings</option></select>
          <select id="filter-status"><option value="all">All Statuses</option></select>
          <select id="filter-urgency"><option value="all">All Urgencies</option></select>
          <select id="filter-sort">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="urgency">Urgency</option>
          </select>
        </div>
      </div>
      <div class="ticket-grid" id="ticket-grid"></div>
    </section>

    <section id="view-dashboard" class="view">
      <h2>Facilities Overview</h2>
      <div class="stat-row" id="stat-row"></div>
      <div class="chart-row">
        <div class="chart-card">
          <h3>Issues by category</h3>
          <canvas id="chart-category"></canvas>
        </div>
        <div class="chart-card">
          <h3>Status breakdown</h3>
          <canvas id="chart-status"></canvas>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
(function(){
  var CATEGORIES = ["Electrical","Plumbing","Furniture","IT & Wi-Fi","HVAC","Structural","Cleaning","Other"];
  var CATEGORY_CODE = {
    "Electrical":"ELEC", "Plumbing":"PLUMB", "Furniture":"FURN", "IT & Wi-Fi":"NET",
    "HVAC":"HVAC", "Structural":"STRUCT", "Cleaning":"CLEAN", "Other":"MISC"
  };
  var BUILDINGS = ["Main Library","Engineering Block","Science Complex","Student Union",
    "Hostel Block A","Hostel Block B","Sports Complex","Admin Block"];
  var STATUS_ORDER = ["Open","Acknowledged","In Progress","Resolved"];
  var STATUS_COLOR = { "Open": "#EF4444", "Acknowledged": "#F59E0B", "In Progress": "#0EA5E9", "Resolved": "#10B981" };
  var STAMP_TEXT_COLOR = { "Open": "#EF4444", "Acknowledged": "#F59E0B", "In Progress": "#0EA5E9", "Resolved": "#10B981" };

  function daysAgoDate(n){ var d = new Date(); d.setDate(d.getDate() - n); return d; }
  function fmtDate(d){ return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }); }
  function dayDiff(a,b){ return Math.round((a-b) / (1000*60*60*24)); }
  function padId(n){ return "WO-" + String(n).padStart(4,"0"); }

  var seedDefs = [
    ["Electrical","Engineering Block","Room 214","Flickering lights in the lab make it hard to see equipment dials.","High","T. Mensah","Resolved",14,11,"Replaced ballast and tube; tested twice."],
    ["Plumbing","Hostel Block A","Room 118","Tap in the shared bathroom won't shut off, water running non-stop.","High",null,"In Progress",3,null,null],
    ["IT & Wi-Fi","Main Library","2nd Floor Study Pods 12-16","Wi-Fi keeps dropping connection near the study pods.","Medium","A. Boateng","Acknowledged",2,null,null],
    ["Furniture","Student Union","Common Room","Two chairs have broken legs — tipping risk.","Medium",null,"Open",1,null,null],
    ["HVAC","Science Complex","Room 305 (Chem Lab)","AC unit blowing warm air, lab reaching uncomfortable temperatures by afternoon.","High","Dr. Owusu (Staff)","In Progress",4,null,null]
  ];

  var issues = [];
  var state = { filters: { search: "", category: "all", building: "all", status: "all", urgency: "all", sort: "newest" } };
  var chartInstances = {};

  function init(){
    loadIssues();
    populateFilters();
    renderBoard();
    setupEventListeners();
    checkQueryParameters();
  }

  function loadIssues(){
    var storedIssues = localStorage.getItem("facilitiesIssues");
    if(storedIssues){
      issues = JSON.parse(storedIssues).map(function(issue){
        return {
          ...issue,
          reportedDate: new Date(issue.reportedDate),
          resolvedDate: issue.resolvedDate ? new Date(issue.resolvedDate) : null,
          viewed: issue.viewed !== undefined ? issue.viewed : (issue.status !== "Open"),
          photo: issue.photo || null,
          contact: issue.contact || null
        };
      });
    } else {
      issues = seedDefs.map(function(def, i){
        return {
          id: padId(i+1),
          category: def[0],
          building: def[1],
          room: def[2],
          description: def[3],
          urgency: def[4],
          reporter: def[5],
          status: def[6],
          reportedDate: daysAgoDate(def[7]),
          resolvedDate: def[8] ? daysAgoDate(def[8]) : null,
          resolutionNote: def[9],
          viewed: def[6] !== "Open",
          photo: null,
          contact: null
        };
      });
      saveIssues();
    }
  }

  function saveIssues(){ localStorage.setItem("facilitiesIssues", JSON.stringify(issues)); }

  function populateFilters(){
    var categoryFilter = document.getElementById("filter-category");
    CATEGORIES.forEach(function(cat){ categoryFilter.add(new Option(cat, cat)); });

    var buildingFilter = document.getElementById("filter-building");
    BUILDINGS.forEach(function(bld){ buildingFilter.add(new Option(bld, bld)); });

    var statusFilter = document.getElementById("filter-status");
    STATUS_ORDER.forEach(function(stat){ statusFilter.add(new Option(stat, stat)); });

    var urgencyFilter = document.getElementById("filter-urgency");
    ["Low","Medium","High"].forEach(function(urg){ urgencyFilter.add(new Option(urg, urg)); });
  }

  function setupEventListeners(){
    document.querySelectorAll(".tab").forEach(function(tab){
      tab.addEventListener("click", function(){ switchView(tab.dataset.view); });
    });

    document.getElementById("filter-search").addEventListener("input", handleFilterChange);
    document.getElementById("filter-category").addEventListener("change", handleFilterChange);
    document.getElementById("filter-building").addEventListener("change", handleFilterChange);
    document.getElementById("filter-status").addEventListener("change", handleFilterChange);
    document.getElementById("filter-urgency").addEventListener("change", handleFilterChange);
    document.getElementById("filter-sort").addEventListener("change", handleFilterChange);
  }

  function checkQueryParameters(){
    var params = new URLSearchParams(window.location.search);
    var newTicketId = params.get("newTicket");
    if(newTicketId) {
      var issue = issues.find(function(i){ return i.id === newTicketId; });
      if(issue) showThankYouModal(issue);
    }
  }

  function switchView(viewId){
    document.querySelectorAll(".view").forEach(function(view){ view.classList.remove("active"); });
    document.getElementById("view-" + viewId).classList.add("active");

    document.querySelectorAll(".tab").forEach(function(tab){ tab.classList.remove("active"); });
    document.querySelector(".tab[data-view=" + viewId + "]").classList.add("active");

    if(viewId === "board") renderBoard();
    if(viewId === "dashboard") renderDashboard();
  }

  function handleFilterChange(){
    state.filters.search = document.getElementById("filter-search").value.trim().toLowerCase();
    state.filters.category = document.getElementById("filter-category").value;
    state.filters.building = document.getElementById("filter-building").value;
    state.filters.status = document.getElementById("filter-status").value;
    state.filters.urgency = document.getElementById("filter-urgency").value;
    state.filters.sort = document.getElementById("filter-sort").value;
    renderBoard();
  }

  function getFiltered(){
    var f = state.filters;
    var urgencyRank = { "High":3, "Medium":2, "Low":1 };
    var list = issues.filter(function(i){
      return (f.category === "all" || i.category === f.category) &&
        (f.building === "all" || i.building === f.building) &&
        (f.status === "all" || i.status === f.status) &&
        (f.urgency === "all" || i.urgency === f.urgency) &&
        (f.search === "" || i.description.toLowerCase().indexOf(f.search) !== -1 || i.id.toLowerCase().indexOf(f.search) !== -1);
    });
    list.sort(function(a,b){
      if(f.sort === "newest") return b.reportedDate - a.reportedDate;
      if(f.sort === "oldest") return a.reportedDate - b.reportedDate;
      if(f.sort === "urgency") return urgencyRank[b.urgency] - urgencyRank[a.urgency] || b.reportedDate - a.reportedDate;
      return 0;
    });
    return list;
  }

  function renderBoard(){
    var grid = document.getElementById("ticket-grid");
    var list = getFiltered();
    grid.innerHTML = "";
    if(list.length === 0){
      grid.innerHTML = '<div class="empty-state">No work orders match these filters.</div>';
      return;
    }
    list.forEach(function(issue){ grid.appendChild(buildTicketCard(issue)); });
  }

  function buildTicketCard(issue){
    var card = document.createElement("div");
    card.className = "ticket";
    var stampColor = STAMP_TEXT_COLOR[issue.status];
    var daysOpen = issue.resolvedDate ? dayDiff(issue.resolvedDate, issue.reportedDate) : dayDiff(new Date(), issue.reportedDate);
    var metaLabel = issue.status === "Resolved" ? ("Resolved in " + daysOpen + "d") : ("Open " + daysOpen + "d");

    card.innerHTML =
      '<div class="ticket-stub">' +
        '<span class="ticket-id">' + issue.id + '</span>' +
        '<span class="stamp" style="color:' + stampColor + '; border-color:' + stampColor + ';">' + issue.status + '</span>' +
      '</div>' +
      '<div class="ticket-main">' +
        '<div class="ticket-top-row">' +
          '<div class="tag-group">' +
            '<span class="cat-tag">' + CATEGORY_CODE[issue.category] + '</span>' +
          '</div>' +
          '<div class="tag-group">' +
            '<span class="viewed-badge ' + (issue.viewed ? "is-viewed" : "is-new") + '">' + (issue.viewed ? "Viewed" : "New") + '</span>' +
            '<span class="urgency-badge urgency-' + issue.urgency + '">' + issue.urgency + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="ticket-loc">' + escapeHtml(issue.building) + ' — ' + escapeHtml(issue.room) + '</div>' +
        '<div class="ticket-desc">' + escapeHtml(issue.description) + '</div>' +
        '<div class="ticket-meta"><span>' + fmtDate(issue.reportedDate) + '</span><span>' + metaLabel + '</span></div>' +
        '<button class="ticket-view-btn" type="button">Manage Ticket &rarr;</button>' +
      '</div>';

    card.querySelector(".ticket-view-btn").addEventListener("click", function(){ openTicketModal(issue.id); });
    return card;
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function openTicketModal(id){
    var issue = issues.find(function(i){ return i.id === id; });
    if(!issue) return;
    var root = document.getElementById("modal-root");
    var next = STATUS_ORDER[STATUS_ORDER.indexOf(issue.status) + 1];

    if(!issue.viewed){
      issue.viewed = true;
      saveIssues();
      renderBoard();
    }

    var staffControlsHtml = "";
    if(next){
      if(next === "Resolved"){
        staffControlsHtml =
          '<div class="modal-section resolution-box">' +
            '<h4>Mark resolved</h4>' +
            '<textarea id="resolution-note-input" rows="3" placeholder="What was done to fix this?"></textarea>' +
            '<div class="modal-actions" style="margin-top:16px;"><button class="btn-primary" id="btn-resolve" type="button">Mark resolved</button></div>' +
          '</div>';
      } else {
        staffControlsHtml = '<div class="modal-actions" style="margin-top:24px;"><button class="btn-primary" id="btn-advance" type="button">Advance to ' + next + '</button></div>';
      }
    }

    var photoHtml = issue.photo ? ('<div class="modal-section"><h4>Photo Attachment</h4><img class="modal-photo" src="' + issue.photo + '" alt="Issue attachment"></div>') : "";

    root.innerHTML =
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal" role="dialog">' +
          '<button class="modal-close" id="modal-close">&times;</button>' +
          '<div class="modal-header">' +
            '<span class="modal-id">' + issue.id + '</span>' +
            '<span class="cat-tag">' + CATEGORY_CODE[issue.category] + '</span>' +
            '<span class="urgency-badge urgency-' + issue.urgency + '">' + issue.urgency + '</span>' +
          '</div>' +
          '<h3>' + escapeHtml(issue.building) + ' — ' + escapeHtml(issue.room) + '</h3>' +
          '<p style="color: var(--color-ink-soft);">' + escapeHtml(issue.description) + '</p>' +
          photoHtml +
          '<div class="modal-section"><h4>Reporter Contact</h4><p style="color: var(--color-ink-soft);">' + escapeHtml(issue.reporter || "Anonymous") + ' ' + (issue.contact ? '('+escapeHtml(issue.contact)+')' : '') + '</p></div>' +
          staffControlsHtml +
        '</div>' +
      '</div>';

    document.getElementById("modal-overlay").addEventListener("click", function(e){ if(e.target.id === "modal-overlay") closeModal(); });
    document.getElementById("modal-close").addEventListener("click", closeModal);

    var advanceBtn = document.getElementById("btn-advance");
    if(advanceBtn) advanceBtn.addEventListener("click", function(){ advanceStatus(issue.id, next, null); });

    var resolveBtn = document.getElementById("btn-resolve");
    if(resolveBtn) resolveBtn.addEventListener("click", function(){
      var note = document.getElementById("resolution-note-input").value.trim() || null;
      advanceStatus(issue.id, "Resolved", note);
    });
  }

  function advanceStatus(id, newStatus, note){
    var issue = issues.find(function(i){ return i.id === id; });
    if(!issue) return;
    issue.status = newStatus;
    if(newStatus === "Resolved"){
      issue.resolvedDate = new Date();
      issue.resolutionNote = note;
    }
    saveIssues();
    closeModal();
    renderBoard();
    showToast(issue.id + " set to " + newStatus);
  }

  function showThankYouModal(issue){
    var root = document.getElementById("modal-root");
    root.innerHTML =
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal thankyou-modal">' +
          '<button class="modal-close" id="modal-close">&times;</button>' +
          '<div class="thankyou-icon">&#128079;</div>' +
          '<h3>Report Submitted Successfully!</h3>' +
          '<p style="color: var(--color-ink-soft);">Your issue has been registered on the management board.</p>' +
          '<div class="thankyou-ticket">Ticket <strong>' + issue.id + '</strong></div>' +
          '<div class="modal-actions" style="justify-content:center;">' +
            '<button class="btn-primary" id="btn-thankyou-view" type="button">Manage Ticket</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    window.history.replaceState({}, document.title, window.location.pathname);

    document.getElementById("modal-overlay").addEventListener("click", function(e){ if(e.target.id === "modal-overlay") closeModal(); });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("btn-thankyou-view").addEventListener("click", function(){
      closeModal();
      openTicketModal(issue.id);
    });
  }

  function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  function renderDashboard(){
    var total = issues.length;
    var open = issues.filter(function(i){ return i.status === "Open"; }).length;
    var ack = issues.filter(function(i){ return i.status === "Acknowledged"; }).length;
    var progress = issues.filter(function(i){ return i.status === "In Progress"; }).length;
    var resolved = issues.filter(function(i){ return i.status === "Resolved"; });

    var byCategory = {}; CATEGORIES.forEach(function(c){ byCategory[c] = 0; });
    issues.forEach(function(i){ byCategory[i.category]++; });

    document.getElementById("stat-row").innerHTML =
      '<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">Total Tickets</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + (open + ack) + '</div><div class="stat-label">Pending Action</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + progress + '</div><div class="stat-label">In Progress</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + resolved.length + '</div><div class="stat-label">Resolved</div></div>';

    drawCategoryChart(byCategory);
    drawStatusChart({ Open: open, Acknowledged: ack, "In Progress": progress, Resolved: resolved.length });
  }

  function drawCategoryChart(byCategory){
    var ctx = document.getElementById("chart-category").getContext("2d");
    if(chartInstances.category) chartInstances.category.destroy();
    
    // Configure default chart fonts and colors for dark theme
    Chart.defaults.color = "#94A3B8";
    Chart.defaults.borderColor = "rgba(255, 255, 255, 0.08)";

    chartInstances.category = new Chart(ctx, {
      type: "bar",
      data: {
        labels: Object.keys(byCategory).map(function(c){ return CATEGORY_CODE[c]; }),
        datasets: [{ data: Object.values(byCategory), backgroundColor: "#6366F1", borderRadius: 8 }]
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
  }

  function drawStatusChart(byStatus){
    var ctx = document.getElementById("chart-status").getContext("2d");
    if(chartInstances.status) chartInstances.status.destroy();
    chartInstances.status = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: Object.keys(byStatus),
        datasets: [{ 
          data: Object.values(byStatus), 
          backgroundColor: [STATUS_COLOR.Open, STATUS_COLOR.Acknowledged, STATUS_COLOR["In Progress"], STATUS_COLOR.Resolved],
          borderWidth: 0
        }]
      },
      options: { plugins: { legend: { position: "bottom", labels: { color: "#94A3B8" } } } }
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
